name: Probe Kiwoom overseas unfilled-order fields (one-off)

# 미국 정규장이 열려 있어야 확인이 된다. 22:30 KST 개장(= 13:30 UTC, 서머타임 기준)
# 직후인 13:40 UTC에 한 번 돌게 걸어 둔다. 필드명을 확인하고 나면 이 워크플로우는
# 지울 것 — 매일 돌려야 할 이유가 없다.
on:
  workflow_dispatch:
  schedule:
    - cron: "40 13 * * 1-5"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 모의계좌에 1주 주문을 넣었다가 바로 취소한다(체결 안 될 가격).
      - name: Probe unfilled-order field names
        env:
          KIWOOM_PAPER_OVERSEAS_APP_KEY: ${{ secrets.KIWOOM_PAPER_OVERSEAS_APP_KEY }}
          KIWOOM_PAPER_OVERSEAS_APP_SECRET: ${{ secrets.KIWOOM_PAPER_OVERSEAS_APP_SECRET }}
        run: python probe_kiwoom_overseas_unfilled.py
