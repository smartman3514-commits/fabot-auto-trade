name: FABOT auto-trade (KIS + Kiwoom)

# 로컬 PC의 run_auto_trade_realtime.bat + Task Scheduler(FABOT_KR_Close/FABOT_US_Close)를
# 그대로 클라우드로 옮긴 것 — 국내장 마감(15:19 KST)과 미국장 마감(04:50 KST) 두 번,
# 같은 스크립트 두 개(KIS/키움)를 돌린다. PC가 꺼져있어도, 화면이 잠겨있어도 실행된다.

on:
  schedule:
    - cron: "19 6 * * 1-5"   # 15:19 KST 평일 (국내장 마감 직전)
    - cron: "50 19 * * 0-4"  # 04:50 KST 평일 (미국장 마감 직전, UTC로는 전날 저녁)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true면 신호만 판정하고 실제 주문은 절대 넣지 않음"
        type: boolean
        default: true

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 키움 접근토큰이 실행마다 새로 발급되면 로컬 개발용 캐시가 무효화되는 문제가
      # 있었다(update-fg.yml에서 이미 겪음) — 같은 방식으로 실행 간에 캐시를 이어받는다.
      - name: Restore Kiwoom token cache
        uses: actions/cache/restore@v4
        with:
          path: .kiwoom_token_cache_demo_domestic.json
          key: kiwoom-domestic-token-${{ github.run_id }}
          restore-keys: |
            kiwoom-domestic-token-

      - name: Run KIS auto-trade (covered call + TQQQ)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KIS_PAPER_APP_KEY: ${{ secrets.KIS_PAPER_APP_KEY }}
          KIS_PAPER_APP_SECRET: ${{ secrets.KIS_PAPER_APP_SECRET }}
          KIS_PAPER_STOCK: ${{ secrets.KIS_PAPER_STOCK }}
        run: >
          python auto_trade_loop.py --realtime
          ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
          2>&1 | tee kis_result.txt

      - name: Run Kiwoom auto-trade (covered call only)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KIWOOM_PAPER_APP_KEY: ${{ secrets.KIWOOM_PAPER_APP_KEY }}
          KIWOOM_PAPER_APP_SECRET: ${{ secrets.KIWOOM_PAPER_APP_SECRET }}
        run: >
          python auto_trade_loop_kiwoom.py --realtime
          ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
          2>&1 | tee kiwoom_result.txt

      - name: Save Kiwoom token cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .kiwoom_token_cache_demo_domestic.json
          key: kiwoom-domestic-token-${{ github.run_id }}

      - name: Upload voice briefing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-briefing-${{ github.run_id }}
          path: output/*.mp3
          if-no-files-found: ignore
          retention-days: 14

      # 인선님 요청(2026-08-20, 2026-08-21 형식 변경): 실행될 때마다(대기든 실제 매매든)
      # 텔레그램으로 결과를 보낸다. 각 스크립트 출력에서 "총 자산/F&G .../최종 신호/
      # -> .../매매기록 저장" 줄만 골라서 요약한다 — 전체 로그를 그대로 보내면 너무
      # 길어서 오히려 안 읽게 된다. "KIS"는 인선님 요청으로 "한국투자"라고 부른다.
      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          summarize() {
            if [ -f "$1" ]; then
              grep -E "총 자산|F&G [0-9]|최종 신호|-> |매매기록 저장" "$1" || echo "(요약할 결과 줄을 못 찾음 — 로그 확인 필요)"
            else
              echo "(실행 로그 없음)"
            fi
          }
          {
            echo "🤖 FABOT 자동매매 실행 ($(date -u -d '+9 hours' '+%Y-%m-%d %H:%M') KST)"
            echo ""
            echo "[한국투자]"
            summarize kis_result.txt
            echo ""
            echo "[키움]"
            summarize kiwoom_result.txt
          } > telegram_message.txt

          python - <<'PY'
          import os
          import requests

          with open("telegram_message.txt", encoding="utf-8") as f:
              text = f.read()

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          resp = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={"chat_id": chat_id, "text": text[:4000]},
              timeout=20,
          )
          resp.raise_for_status()
          print("텔레그램 알림 전송 완료")
          PY
