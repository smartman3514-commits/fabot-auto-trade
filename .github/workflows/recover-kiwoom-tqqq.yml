name: Recover missed Kiwoom TQQQ buy (one-off, 2026-09-18)

# 왜 있는가: 키움판이 TQQQ를 아예 실행하지 않아 2026-09-18 04:45 KST의 F&G 29점
# 매수 신호를 놓쳤다(KIS는 349주 매수 완료). F&G<=30 신호는 자주 오지 않아서 다음
# 마감 창(09-19 04:40~05:20 KST)까지 기다리면 그 사이 F&G가 30을 넘어 아예 못 살
# 위험이 있다 — 사용자가 "오늘 밤 장 열리면 바로"를 선택(2026-09-18).
#
# 그래서 이 실행만 마감 창 가드를 끈다(--ignore-window). 정규 스케줄(auto-trade.yml)은
# 그대로 마감 창에서만 돈다.
#
# **하루짜리다.** 아래 date 가드가 2026-09-18(UTC)이 아니면 아무것도 하지 않는다.
# 실행이 끝나면 이 파일을 지울 것.

on:
  workflow_dispatch:
  schedule:
    - cron: "40 13 * * *" # 22:40 KST — 미국 정규장(22:30 KST) 개장 10분 뒤

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stop unless today is the one intended day
        run: |
          today="$(date -u +%Y-%m-%d)"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$today" != "2026-09-18" ]; then
            echo "오늘($today)은 이 1회성 복구 실행일이 아닙니다 — 아무것도 하지 않습니다."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: env.SKIP != '1'
        run: pip install -r requirements.txt

      # 먼저 미체결 응답의 실제 필드명을 확인해 둔다(1주 주문 → 필드 확인 → 즉시 취소).
      # 실패해도 매수는 그대로 진행한다 — 추격주문이 보유수량 증감으로 대체 측정하므로.
      - name: Probe unfilled-order field names (non-blocking)
        if: env.SKIP != '1'
        continue-on-error: true
        env:
          KIWOOM_PAPER_OVERSEAS_APP_KEY: ${{ secrets.KIWOOM_PAPER_OVERSEAS_APP_KEY }}
          KIWOOM_PAPER_OVERSEAS_APP_SECRET: ${{ secrets.KIWOOM_PAPER_OVERSEAS_APP_SECRET }}
        run: python probe_kiwoom_overseas_unfilled.py

      - name: Buy TQQQ on Kiwoom demo (window guard off for this run only)
        if: env.SKIP != '1'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KIWOOM_PAPER_APP_KEY: ${{ secrets.KIWOOM_PAPER_APP_KEY }}
          KIWOOM_PAPER_APP_SECRET: ${{ secrets.KIWOOM_PAPER_APP_SECRET }}
          KIWOOM_PAPER_OVERSEAS_APP_KEY: ${{ secrets.KIWOOM_PAPER_OVERSEAS_APP_KEY }}
          KIWOOM_PAPER_OVERSEAS_APP_SECRET: ${{ secrets.KIWOOM_PAPER_OVERSEAS_APP_SECRET }}
        run: python auto_trade_loop_kiwoom.py --realtime --ignore-window 2>&1 | tee kiwoom_recover.txt

      - name: Notify on Telegram
        if: always() && env.SKIP != '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          SUMMARY=$(grep -E "F&G [0-9]|최종 신호|주문가능 외화현금|매매기록 저장|체결 확인|-> |건너뜁니다" kiwoom_recover.txt 2>/dev/null | tail -12)
          [ -z "$SUMMARY" ] && SUMMARY="(결과 줄을 못 찾음 — Actions 로그 확인 필요)"
          export SUMMARY
          python - <<'PY'
          import os, requests
          text = "[키움 TQQQ 복구 실행 — 09-18 놓친 신호]\n\n" + os.environ["SUMMARY"]
          requests.post(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
              json={"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": text[:4000]},
              timeout=20,
          ).raise_for_status()
          print("텔레그램 알림 전송 완료")
          PY
